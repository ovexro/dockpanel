server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The document must revalidate, or a deploy is invisible to anyone who has
    # visited before: with no cache directive the browser applies heuristic
    # freshness, roughly a tenth of the time since the file last changed, and
    # the bundle it points at under /assets/ is served immutable.
    # The headers are REPEATED because a location block's add_headers replace
    # the server block's set rather than merging with it.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Hashed filenames, so a year is safe. ONE Cache-Control: the expires
    # directive emits its own on top of any add_header, and the pair went out as
    # two separate header lines saying different things. Not "always" on the
    # cache header — a 404 during a deploy must not be cached for a year.
    # The security headers repeat the server set because a location block's
    # add_headers replace it rather than merging; this block carried none of
    # them, so every script went out with no nosniff.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
