<!-- The same mark as the header logo, drawn heavier. A favicon is read at
     16px, where the logo's proportions go thin: the block fills more of the
     canvas and the notch is deeper, so the silhouette still reads as one
     solid form with a unit pulled out of it rather than as a green smudge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect width="24" height="24" fill="#0a0a0b"/>
  <path d="M3 1h18v22H3z" fill="#43ef82"/>
  <path d="M7 12h10v5H7z" fill="#0a0a0b"/>
</svg>
