# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=dockpanel_api:10m rate=30r/s;

# Marketing website — dockpanel.dev
server {
    listen __ORIGIN_IP__:80;
    listen [::]:80;
    server_name dockpanel.dev www.dockpanel.dev;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen __ORIGIN_IP__:443 ssl;
    listen [::]:443 ssl;
    server_name dockpanel.dev www.dockpanel.dev;

    ssl_certificate /etc/letsencrypt/live/dockpanel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dockpanel.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # s271: this policy silently broke the page it protects. `style-src 'self'`
    # blocked the Google Fonts stylesheet the HTML asked for, so NO webfont had
    # ever loaded for any visitor — the site rendered in whatever sans the
    # visitor's OS ships, and looked different on every one. Fonts are now
    # bundled with the app, so 'self' is correct and no exception is needed:
    # the fix was to remove the third-party request, not to widen the policy.
    # `connect-src 'self'` likewise blocked the api.github.com star count; that
    # one origin is named explicitly rather than opened up.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # www → apex redirect
    if ($host = www.dockpanel.dev) {
        return 301 https://dockpanel.dev$request_uri;
    }

    # Marketing website static files
    root __SITE_ROOT__/website/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # s278: the document must revalidate. It was served with NO cache directives
    # at all, so browsers fall back to HEURISTIC freshness — roughly a tenth of
    # the time since the file last changed — and a returning visitor kept the
    # pre-deploy page, whose script tag points into /assets/ where everything is
    # marked immutable. `npm run build` IS the deploy here and builds are weeks
    # apart, so that window was days, not minutes: every deploy this site has
    # ever made was invisible to returning visitors for a while.
    #
    # It went unnoticed because the freshness check is a curl, and curl has no
    # cache. Caught only by driving the page in a real browser, which re-served
    # the stale document one minute after a deploy with transferSize 0.
    #
    # `no-cache` still allows storing — it forces revalidation, so the usual
    # answer is a 304 and the cost is one conditional request per visit.
    #
    # Every add_header below is a REPEAT, not an addition: a location block's
    # add_headers replace the server block's set entirely (the note in /assets/
    # below says so, and that block is itself missing four of them). This is the
    # response that carries the CSP, so dropping them here to gain one cache
    # header would be a much worse trade than the bug being fixed.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # s281: this block repeated three of the server block's seven headers, so
    # every script and stylesheet the site serves went out without the CSP,
    # Referrer-Policy, Permissions-Policy or X-XSS-Protection. A location
    # block's add_headers REPLACE the parent set rather than merging with it,
    # so "some of them" is not a partial fix — it is the full set, minus four.
    #
    # ONE Cache-Control: `expires 1y` emitted its own (max-age=31536000) on top
    # of the add_header, and the response carried two lines saying different
    # things. Not `always` on it — an error response must never be cached, or a
    # 404 during a deploy is remembered for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}

# Panel demo — demo.dockpanel.dev
server {
    listen __ORIGIN_IP__:80;
    listen [::]:80;
    server_name demo.dockpanel.dev;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen __ORIGIN_IP__:443 ssl;
    listen [::]:443 ssl;
    server_name demo.dockpanel.dev;

    ssl_certificate /etc/letsencrypt/live/demo.dockpanel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.dockpanel.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10m;

    # ── REGISTRATION BLOCKED — only admin can use the panel ──
    location /api/auth/register {
        return 403 '{"error":"Registration is disabled"}';
        add_header Content-Type application/json always;
    }

    # Agent WebSocket terminal (secured: command blocklist + PR_SET_NO_NEW_PRIVS + rbash)
    location /agent/terminal/ws {
        proxy_pass http://unix:/var/run/dockpanel/agent.sock:/terminal/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;  # Prevent logging JWT tokens from query params
    }

    # Agent WebSocket log stream
    location /agent/logs/stream {
        proxy_pass http://unix:/var/run/dockpanel/agent.sock:/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;  # Prevent logging JWT tokens from query params
    }

    # Agent API (all other agent routes — secured with input validation)
    location /agent/ {
        proxy_pass http://unix:/var/run/dockpanel/agent.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # API → backend (rate limited)
    location /api/ {
        limit_req zone=dockpanel_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # Dashboard WebSocket metrics (read-only, safe)
    location /api/ws/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;  # Prevent logging any tokens from query params
    }

    # Panel frontend static files
    root __SITE_ROOT__/panel/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # s281: the s278 cache fix went to dockpanel.dev — the block above in THIS
    # FILE — and never to the demo panel, which had the identical defect and
    # kept serving its document with no cache directive at all for three more
    # sessions. Measured on the live wire before this was written: dockpanel.dev
    # returned `cache-control: no-cache`, demo.dockpanel.dev returned no
    # cache-control header whatsoever. The fix went where the bug was noticed
    # rather than to every surface that had it.
    #
    # That matters more here than on the marketing site: nginx serves the demo
    # panel straight out of the working tree, so a rebuilt frontend is live
    # instantly — and invisible to anyone who had already visited, who goes on
    # running the previous bundle against the current backend.
    #
    # Every add_header is a REPEAT of the server set, which a location block
    # replaces rather than merges with.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Static assets: hashed filenames, so a year is safe. ONE Cache-Control —
    # `expires 1y` emitted a second, conflicting one. Not `always` on it: a 404
    # mid-deploy must not be cached for a year. The security headers repeat the
    # full server set; this block carried three of seven, so the demo panel
    # served its JS with no CSP.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Drop-in location blocks for path-mounted tools (webmail, etc.)
    include /etc/nginx/conf.d/dockpanel-panel.locations/*.conf;
}
