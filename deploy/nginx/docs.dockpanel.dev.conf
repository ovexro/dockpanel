# docs.dockpanel.dev — mdbook static output, served straight off this box.
# Recreated at s256 after a DockPanel site-create/delete cycle removed the
# original vhost (the reserved-domain guard had been made inert; see s256).
#
# NOTE the explicit interface listen (__ORIGIN_IP__), matching every sibling
# block in dockpanel.dev.conf: a wildcard :443 listen here makes this vhost the
# de-facto default for the address and Cloudflare returns 526 at the edge.
server {
    listen __ORIGIN_IP__:80;
    listen [::]:80;
    server_name docs.dockpanel.dev;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen __ORIGIN_IP__:443 ssl;
    listen [::]:443 ssl;
    server_name docs.dockpanel.dev;

    ssl_certificate /etc/letsencrypt/live/docs.dockpanel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.dockpanel.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root __SITE_ROOT__/docs/book;
    index index.html;

    # s281: the third surface with the s278 defect, and the one where it had
    # already been observed doing damage. Documents were served with no cache
    # directive at all, so a returning visitor got heuristic freshness —
    # roughly a tenth of the file's age, which on docs rebuilt a few times a
    # month is days. `Live Surfaces` failed at s280 on exactly this page still
    # reading "Reflects v2.47.0" after the bump; that instance was an unbuilt
    # mdbook, but a visitor holding a cached copy sees the same symptom from
    # the other direction and no rebuild fixes it.
    #
    # The directive goes on `location /` rather than a `~* \.html$` regex:
    # mdbook URLs are extensionless (`/testing` resolves to `testing.html` via
    # try_files, INSIDE this location), so an extension-matched location would
    # never see them.
    #
    # The add_headers repeat the server set, which a location block replaces
    # rather than merges with.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # mdbook does NOT content-hash these filenames — it emits `css/general.css`
    # and `book.js` on every build — so a positive max-age reopens the very gap
    # the block above closes: a theme or search-index change would be invisible
    # to a returning visitor for the whole window (7 days, as this was set).
    # Revalidation is the correct policy for an unhashed name; the usual answer
    # is a 304 costing one conditional request and zero bytes of body.
    #
    # This block also carried NONE of the six server headers, so every
    # stylesheet and script docs.dockpanel.dev serves went out with no nosniff,
    # and `expires` emitted a second Cache-Control contradicting the add_header.
    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
