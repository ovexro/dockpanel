name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release page is where most people meet this project, and it used to show
  # an auto-generated commit list — so the CHANGELOG's account of what was broken
  # and what is still broken never reached a single reader. This job lifts the
  # tag's own section out of CHANGELOG.md and hands it to the release body.
  #
  # It runs FIRST and everything else needs it, so a tag pushed without a
  # changelog entry costs ~20 seconds instead of a full build. It fails loudly
  # rather than falling back to the generated notes: a silent fallback is exactly
  # the behaviour being fixed here.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract this tag's section from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # index(...)==1 rather than a regex: the version contains dots, and
          # anchoring on a literal prefix avoids escaping them into a match for
          # "2x36x0". Stops at the next "## [" so the next release is excluded.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > section.md

          # Trim leading and trailing blank lines.
          sed -e '/./,$!d' section.md | tac | sed -e '/./,$!d' | tac > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Add the entry for ${GITHUB_REF_NAME} before tagging — the release body is written from it."
            exit 1
          fi

          cat >> release-notes.md <<'FOOTER'

          ---

          **Install:** `curl -sL dockpanel.dev/install.sh | bash`

          Every release is installed on a throwaway VPS and driven as a user before
          it ships. What that means, and what it has found, is written up at
          <https://docs.dockpanel.dev/testing.html>.

          Binaries are static musl builds signed with Sigstore; `checksums.txt`
          and the `.sig`/`.pem` pairs are attached below.
          FOOTER

          # The compare link the generated notes would have given us. Taken from
          # the heading that FOLLOWS this version's section (not simply the
          # second heading in the file) so that re-tagging an older release
          # still points at that release's real predecessor.
          PREV=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 {
              sub(/^## \[/, ""); sub(/\].*/, ""); print; exit
            }
          ' CHANGELOG.md)
          if [ -n "$PREV" ] && [ "$PREV" != "$VERSION" ]; then
            echo "" >> release-notes.md
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/v${PREV}...${GITHUB_REF_NAME}" >> release-notes.md
          fi

          echo "Release body (${VERSION}):"
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # The same job ci.yml runs. It is here because ci.yml triggers only on
  # `push: branches: [main]` and pull_request — IT DOES NOT RUN ON A TAG — and
  # this repo has no rulesets and no required status checks, so until s340 a
  # release consulted the pin suites exactly never. v2.95.1 published 33 assets
  # carrying a reverted SFTP transport while its CI run, started five seconds
  # earlier on a different trigger, raced alongside with no authority to stop it.
  #
  # `build` needs it, so a red pin skips build → release → smoke-test and
  # nothing publishes. The pins were always the instrument; this is what makes
  # them the gate.
  regression-pins:
    name: Every Regression Pin
    uses: ./.github/workflows/regression-pins.yml

  build:
    needs: [changelog, regression-pins]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Static musl binaries (zero glibc dependency) so the agent/API/CLI run on
      # the whole support matrix regardless of distro libc version — Debian 11/12,
      # Ubuntu 20.04+, CentOS/Rocky 9, Amazon Linux 2023 (#70). cargo-zigbuild uses
      # Zig's bundled clang as the C cross-compiler, which builds aws-lc-sys (the
      # only C dependency in the tree) statically for both musl targets from a
      # single x86_64 runner. The rest of the TLS stack is pure rustls.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build agent (static musl)
        run: cargo zigbuild --release --target ${{ matrix.target }} --manifest-path panel/agent/Cargo.toml

      - name: Build API (static musl)
        run: cargo zigbuild --release --target ${{ matrix.target }} --manifest-path panel/backend/Cargo.toml

      - name: Build CLI (static musl)
        run: cargo zigbuild --release --target ${{ matrix.target }} --manifest-path panel/cli/Cargo.toml

      - name: Package binaries
        run: |
          mkdir -p release
          cp panel/agent/target/${{ matrix.target }}/release/dockpanel-agent release/dockpanel-agent-linux-${{ matrix.arch }}
          cp panel/backend/target/${{ matrix.target }}/release/dockpanel-api release/dockpanel-api-linux-${{ matrix.arch }}
          cp panel/cli/target/${{ matrix.target }}/release/dockpanel release/dockpanel-cli-linux-${{ matrix.arch }}
          chmod +x release/*

          # Report binary sizes + confirm static linkage
          echo "Binary sizes (${{ matrix.arch }}):"
          ls -lh release/
          echo "Linkage check:"
          file release/dockpanel-agent-linux-${{ matrix.arch }}

      - name: Install cargo-sbom
        if: matrix.arch == 'amd64'
        run: cargo install cargo-sbom --locked --version ^0.10 --force

      - name: Generate SBOMs (SPDX JSON)
        if: matrix.arch == 'amd64'
        run: |
          cargo sbom --project-directory panel/agent   --output-format spdx_json_2_3 > release/dockpanel-agent.spdx.json
          cargo sbom --project-directory panel/backend --output-format spdx_json_2_3 > release/dockpanel-api.spdx.json
          cargo sbom --project-directory panel/cli     --output-format spdx_json_2_3 > release/dockpanel-cli.spdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: release/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd panel/frontend
          npm ci
          npx vite build

      - name: Package frontend
        run: |
          cd panel/frontend
          tar czf ../../dockpanel-frontend.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: dockpanel-frontend.tar.gz

  release:
    needs: [changelog, build, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/binaries-amd64/* release/
          cp artifacts/binaries-arm64/* release/
          cp artifacts/frontend/dockpanel-frontend.tar.gz release/

          # The notes come down with the other artifacts but are the release
          # BODY, not an asset — keep them out of release/ so they are not
          # published, checksummed or signed as a downloadable file.
          test -s artifacts/release-notes/release-notes.md

          # Create checksums (over binaries + SBOMs, before signatures)
          cd release
          sha256sum dockpanel-* > checksums.txt

          echo "Release contents:"
          ls -lh

      - name: Install cosign (pinned v2.4.1, retried + checksum-verified)
        continue-on-error: true
        run: |
          set -euo pipefail
          # s232: sigstore/cosign-installer's single un-retried fetch got a
          # connection reset and aborted the WHOLE release job before publish —
          # the tag existed but no release object did. Install cosign ourselves
          # with retries + a fail-closed checksum against Sigstore's own published
          # sums, and make the step non-fatal so a total Sigstore outage ships an
          # unsigned release instead of losing the publish entirely.
          COSIGN_VERSION=v2.4.1
          BASE="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cosign "${BASE}/cosign-linux-amd64" \
               && curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cosign_checksums.txt "${BASE}/cosign_checksums.txt" \
               && grep ' cosign-linux-amd64$' /tmp/cosign_checksums.txt \
                    | sed 's#cosign-linux-amd64#/tmp/cosign#' | sha256sum -c -; then
              ok=1; break
            fi
            echo "cosign install attempt ${attempt} failed; retrying in 15s..."
            rm -f /tmp/cosign /tmp/cosign_checksums.txt
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::cosign install failed after 5 attempts — this release will publish UNSIGNED"
            echo "⚠️ cosign install failed — this release is UNSIGNED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Sign release assets (keyless via Sigstore)
        continue-on-error: true
        run: |
          cd release
          # An EXPLICIT identity token, refreshed per asset, rather than letting
          # cosign detect an ambient one.
          #
          # v2.99.0 signed 4 of 11 assets and the step still reported success.
          # On the 5th, cosign's ambient detection missed and it fell back to
          # INTERACTIVE device flow — printing "Enter the verification code ... in
          # your browser" on a headless runner, where no browser will ever arrive.
          # Supplying the identity explicitly leaves no interactive path to fall
          # back to, so a token failure fails that asset in seconds instead of
          # stalling the loop and silently dropping every asset after it.
          mint_token() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          signed=0; total=0; failed=""
          for f in $(ls | grep -v '\.sig$' | grep -v '\.pem$'); do
            total=$((total+1))
            ok=0
            for attempt in 1 2 3; do
              echo "Signing $f (attempt $attempt)"
              if TOK=$(mint_token) && [ -n "$TOK" ] && cosign sign-blob --yes \
                   --identity-token "$TOK" \
                   --output-signature "${f}.sig" \
                   --output-certificate "${f}.pem" \
                   "$f"; then ok=1; break; fi
              sleep 5
            done
            # A .sig the signer did not finish writing is worse than none: it
            # would satisfy a coverage count while verifying against nothing.
            if [ "$ok" = "1" ] && [ -s "${f}.sig" ] && [ -s "${f}.pem" ]; then
              signed=$((signed+1))
            else
              rm -f "${f}.sig" "${f}.pem"
              failed="${failed} ${f}"
            fi
          done

          echo "SIGNED_COUNT=${signed}" >> "$GITHUB_ENV"
          echo "ASSET_COUNT=${total}"  >> "$GITHUB_ENV"
          echo "::notice::Signed ${signed}/${total} release assets"
          [ -n "$failed" ] && echo "::warning::UNSIGNED:${failed}"
          echo "Signed assets:"
          ls -lh ./*.sig ./*.pem 2>/dev/null || echo "  (none)"

      # The publish must never be lost to a Sigstore outage — that is why the step
      # above is continue-on-error, and it stays that way. What must not survive is
      # the release BODY asserting signatures that are not attached: v2.99.0 told
      # every reader "the .sig/.pem pairs are attached below" over 7 unsigned
      # artefacts. The claim is now reconciled against what was actually produced,
      # here, after signing and before publishing.
      - name: Reconcile the signing claim with what was signed
        run: |
          set -euo pipefail
          NOTES=artifacts/release-notes/release-notes.md
          [ -f "$NOTES" ] || { echo "no release notes at $NOTES"; exit 1; }
          A=$(ls release | grep -vc -e '\.sig$' -e '\.pem$')
          S=$(ls release | grep -c '\.sig$' || true)
          echo "artefacts=$A signed=$S"
          if [ "$S" -eq "$A" ] && [ "$A" -gt 0 ]; then
            echo "::notice::All $A artefacts signed — the published claim stands."
            exit 0
          fi
          echo "::warning::Only $S of $A artefacts are signed — rewriting the claim."
          python3 - "$NOTES" "$S" "$A" <<'PY'
          import sys, pathlib, re
          notes, signed, total = pathlib.Path(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3])
          text = notes.read_text()
          claim = ("Binaries are static musl builds signed with Sigstore; `checksums.txt`\n"
                   "and the `.sig`/`.pem` pairs are attached below.")
          if signed:
              honest = (f"Binaries are static musl builds. **{signed} of {total} assets carry a "
                        f"Sigstore `.sig`/`.pem` pair**; the rest could not be signed on this run "
                        f"and are attached unsigned. Verify any asset against `checksums.txt`.")
          else:
              honest = ("Binaries are static musl builds. **Signing did not run on this release** — "
                        "no `.sig`/`.pem` pairs are attached. Verify against `checksums.txt`.")
          notes.write_text(text.replace(claim, honest) if claim in text
                           else text.rstrip() + "\n\n" + honest + "\n")
          print("claim reconciled")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The body is exactly the CHANGELOG section, and nothing else appends
          # to it. generate_release_notes is deliberately NOT set: GitHub's
          # documented behaviour when both are supplied reads ambiguously, and
          # what a reader sees first is the entire point of this change. The
          # compare link the generated notes would have provided is written into
          # the body by the changelog job instead.
          body_path: artifacts/release-notes/release-notes.md
          files: |
            release/*

  # The #70 ABI/loader guard. It has to be called from here: publishing with the
  # default GITHUB_TOKEN does not raise a `release: published` event that can
  # start another workflow, so smoke-test.yml's own trigger never fires.
  smoke-test:
    needs: release
    uses: ./.github/workflows/smoke-test.yml
    with:
      tag: ${{ github.ref_name }}
