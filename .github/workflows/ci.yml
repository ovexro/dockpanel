name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy — Agent
        run: cargo clippy --manifest-path panel/agent/Cargo.toml --release 2>&1 || true

      - name: Clippy — Backend
        run: cargo clippy --manifest-path panel/backend/Cargo.toml --release 2>&1 || true

      - name: Clippy — CLI
        run: cargo clippy --manifest-path panel/cli/Cargo.toml --release 2>&1 || true

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install dependencies
        run: cd panel/frontend && npm ci

      - name: Type check
        run: cd panel/frontend && npx tsc --noEmit

  build-rust:
    name: Build (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build Agent
        run: cargo build --release --manifest-path panel/agent/Cargo.toml

      - name: Build Backend
        run: cargo build --release --manifest-path panel/backend/Cargo.toml

      - name: Build CLI
        run: cargo build --release --manifest-path panel/cli/Cargo.toml

      - name: Report binary sizes
        run: |
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | $(du -h panel/agent/target/release/dockpanel-agent | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| API | $(du -h panel/backend/target/release/dockpanel-api | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI | $(du -h panel/cli/target/release/dockpanel | cut -f1) |" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install and build
        run: |
          cd panel/frontend
          npm ci
          npx vite build

      - name: Report bundle size
        run: |
          echo "### Frontend Bundle" >> $GITHUB_STEP_SUMMARY
          du -sh panel/frontend/dist/ >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Test Agent
        run: cargo test --manifest-path panel/agent/Cargo.toml

      - name: Test Backend
        run: cargo test --manifest-path panel/backend/Cargo.toml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Audits are ENFORCING (no `|| true`): a real advisory now FAILS the build.
      # Accepted, upstream-blocked items are ignored narrowly and on purpose —
      # panel/backend/.cargo/audit.toml pins RUSTSEC-2023-0071 (the rsa phantom
      # lockfile entry from sqlx-mysql; DockPanel is Postgres-only). Unmaintained
      # and yanked advisories are cargo-audit *warnings* and do not fail the run.
      - name: Audit Agent
        run: cd panel/agent && cargo audit

      - name: Audit Backend
        run: cd panel/backend && cargo audit

      - name: Audit CLI
        run: cd panel/cli && cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # npm has no ignore mechanism, so one advisory that cannot affect us kept
      # this whole job red on every commit for six releases — and a job that is
      # always failing cannot report a NEW failure. The gate below still fails
      # the build on anything at high/critical; it waives only advisories listed
      # in scripts/npm-audit-gate.mjs with a written reason, prints that reason,
      # and flags a waiver that no longer matches anything.
      # Its own behaviour (both directions) is pinned in
      # tests/ssl-correctness-pin-e2e.sh.
      - name: Audit Frontend
        run: cd panel/frontend && npm ci && node ../../scripts/npm-audit-gate.mjs

      - name: Audit Marketing Site (client)
        run: cd website/client && npm ci && node ../../scripts/npm-audit-gate.mjs

      - name: Audit Marketing Site (server)
        run: cd website/server && npm ci && node ../../scripts/npm-audit-gate.mjs

  # s263: the same fact was published on three surfaces — the .md files GitHub
  # renders, docs.dockpanel.dev, and the dockpanel.dev marketing site — and kept
  # in sync by hand. It drifted: the app-template count read 152 in ten places
  # while the catalogue held 153, and FEATURES.md was stamped with a version
  # five months and 28 releases old. Neither was discoverable without counting a
  # Rust array by hand, so neither was ever discovered.
  #
  # This job makes the published numbers derive from source and checks them on
  # every commit, which is the only version of "keep the docs in sync" that does
  # not depend on somebody remembering.
  docs-claims:
    name: Documentation Claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Published claims match the source
        run: bash tests/docs-claims-pin-e2e.sh

  # s278 found index.html served with no cache directive at all, so every deploy
  # was invisible to returning visitors while the documented curl check read
  # green — curl has no cache. s280 gave that fix a delivery path for boxes that
  # had already installed. Neither shipped with a pin, and this project's history
  # is that an unpinned fix regresses.
  #
  # The suite serves the REAL template with a REAL nginx, because the defect
  # class here is not visible in the source: a location block's add_headers
  # REPLACE the server block's set rather than merging with it, so a block that
  # reads fine in isolation silently strips six headers off the response. It also
  # asserts a 200 before reading any header — the s280 harness returned 403 for
  # every request and eleven of its twelve assertions still passed, because these
  # headers are `always` and nginx emits them on error pages too.
  nginx-contract:
    name: Nginx Response Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: The served headers match the shipped templates
        run: bash tests/nginx-headers-pin-e2e.sh

      # Off-box this cannot diff against the live vhosts, so it asserts the
      # committed copies exist and carry no host-specific value. The three
      # public surfaces were hand-edited files with no copy anywhere until s281.
      - name: The committed site vhosts are present and host-agnostic
        run: bash scripts/sync-site-vhosts.sh --check

  update-rollback:
    name: Update & Rollback Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Drives restore-snapshot.sh end to end against a scratch tree with
      # stubbed systemctl/docker/curl. It needs no box and no build, but it must
      # run somewhere other than the author's machine: the guard it exercises
      # decides whether a panel is left stopped, and the one thing worse than
      # that guard being wrong is it never having been executed.
      - name: A rollback cannot undo itself, and a failed update reports
        run: bash tests/update-rollback-pin-e2e.sh

  agent-error-contract:
    name: Agent Error Propagation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis — no box, no build. Guards the boundary where an
      # agent's deliberate 4xx ("Path must be within /var/backups/ or /tmp/")
      # used to become a generic 502 that the frontend then rendered as "Agent
      # offline". Three separate reporters filed three separate bugs against
      # that one sentence (#90, #91, #92), so the contract is worth a job.
      - name: An agent that answers is not an agent that is offline
        run: bash tests/agent-error-propagation-pin-e2e.sh

  backup-dest-git-env:
    name: Destination + Deploy Env Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis — no box, no build. Two contracts across the same
      # seam: what the panel sends the agent, and whether a screen exists for
      # what the API accepts. #94 was a JSON key the two sides spelled
      # differently, made silent by serde(default). #93 was a form switched off
      # in place, leaving three endpoints with no caller and an empty state
      # pointing at the screen the control had just been taken from — plus two
      # upload paths posting the stored ciphertext as the credential while Test
      # Connection decrypted and reported success.
      - name: Both halves of a feature must be connected to each other
        run: bash tests/backup-destinations-git-env-pin-e2e.sh

  agent-sandbox-paths:
    name: Agent Sandbox Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. The agent runs ProtectSystem=strict, so a path it
      # writes but does not declare in ReadWritePaths fails at the KERNEL with
      # "Read-only file system" — the feature never works, on any install, and
      # nothing in its own code looks wrong. That has now shipped three times
      # (/etc/apt, /var/spool/cron, /etc/ssh), each found by a user. This derives
      # the write paths from the source instead of restating them.
      - name: A path the agent writes must be a path the sandbox allows
        run: bash tests/agent-sandbox-paths-pin-e2e.sh

  backup-lands:
    name: Backups Actually Land
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. s288 fixed the backup credential path and proved
      # Test Connection; s289 drove a backup all the way to the destination and
      # found six defects underneath, four of which make the panel state
      # something FALSE about data protection — a redirect reported as a
      # completed upload, a scheduled off-site copy filed as local-only, a 60s
      # panel cap over a 600s agent operation, and a Test that passes because it
      # exercises less than an upload needs. A green check over a broken thing
      # is this feature's recurring failure, so these are checks now.
      - name: A backup the panel calls off-site must actually be off-site
        run: bash tests/backup-lands-pin-e2e.sh

  migration-analyze-async:
    name: Migration Analysis Is Accepted, Not Performed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. Analysing a cPanel archive ran inline in the HTTP
      # request while every gateway in front of the panel gives up sooner than
      # the work takes — Cloudflare at 100s, the installed nginx at 300s, the
      # panel's own TimeoutLayer at 300s — so issue #91 was structural: the
      # request could only ever be torn down for the archives the wizard exists
      # to import, and the analysis then finished with nothing able to report it.
      # This holds the four halves of the fix together: accept and spawn, let the
      # agent own its own ceiling, keep the verdict in a row that outlives the
      # request, and read it back from the browser.
      - name: A job longer than the gateway must not be held open by it
        run: bash tests/migration-analyze-async-pin-e2e.sh

  php-install-from-picker:
    name: The PHP Version Picker Can Install A Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. The version-specific PHP installer has existed end
      # to end since v2.8 — agent route, third-party repos, RHEL module streams,
      # backend proxy — and nothing in the browser had ever called it, so both
      # pickers offered five versions with no idea which existed and sent anyone
      # who picked wrong to a Settings tile that cannot install a version. Same
      # family as the backup finding: a capability that is complete except for
      # the one link that makes it reachable.
      - name: A control that knows a version is missing must be able to install it
        run: bash tests/php-install-from-picker-pin-e2e.sh

  provision-log-ownership:
    name: A Provisioning Log Belongs To Somebody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. `provision_logs` is one flat keyspace shared by
      # nine features, so an endpoint that looks a caller-supplied uuid up in it
      # reaches every other feature's stream unless it proves ownership itself.
      # Five endpoints did that five different ways: the service-install stream
      # discarded its claims and checked nothing, and the git-deploy stream fell
      # through whenever the id had no owner recorded — which was 13 of the 16
      # creation sites, so any signed-in account could read another tenant's site
      # provisioning log, and that stream deliberately carries the generated CMS
      # admin password in cleartext. Ownership now lives on the KEY, and this
      # holds the shape that makes that true: one way in, one way out, no reader
      # exempting admins, and a UI that no longer draws a refused stream as a
      # completed one.
      - name: Nobody reaches the shared log map without proving whose log it is
        run: bash tests/provision-log-ownership-pin-e2e.sh

  backup-truth:
    name: A Backup Says What Actually Happened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. The backup subsystem reported confidently on work
      # it had not done: two SLA queries read a column `backups` has never had,
      # so the Restore Confidence card was dead on every install and said so as
      # an empty state; five INSERT sites discarded their result, so an archive
      # the panel could not record still counted as a success; a destination's
      # stored secret was destroyed by clearing its field and echoed back by
      # renaming the row; and the Encrypt option covered database dumps only
      # while a site archive — which carries a dump of that site's databases —
      # went to the same destination in cleartext. The arms below are keyed on
      # the capability a regression must use, not on the spelling this tree
      # happens to have: you cannot read a site's server without naming `sites`,
      # you cannot use a response you have not destructured, and you cannot
      # return a row without passing it through the masker.
      - name: A backup reports what happened to it, not what was attempted
        run: bash tests/backup-truth-pin-e2e.sh

  scheme-and-import:
    name: The Panel Serves What It Says It Serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. Two families of the same mistake: two ends of the
      # panel disagreeing about something each of them already knew.
      #
      # The SCHEME — five places printed or fetched `https://<a user's domain>`
      # while a certificate on disk, an ssl_email on the row, or an `ssl` flag in
      # the very response being read said otherwise; and the "optional" SSL email
      # was not optional, so an operator terminating TLS upstream could not
      # decline a certificate request that could never succeed.
      #
      # The PATHS — the migration importer wrote a site's files one level above
      # the directory its own vhost serves and then deleted that directory on the
      # way past, and resolved the archive root differently from the analyser
      # that produced the paths it was joining.
      #
      # The arms are keyed on the capability a regression must use and were then
      # ATTACKED: fourteen deliberate evasions against the fixed tree, of which
      # five beat the first draft. Hence the liveness checks (dead code and
      # discarded results satisfy a presence grep) and the real function-body
      # extractor (a fixed -A window is satisfied by the NEXT function).
      - name: The scheme is derived, and the importer writes where nginx looks
        run: bash tests/scheme-and-import-pin-e2e.sh

  domain-claim:
    name: One Door Owns A Domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. Two questions nothing owned.
      #
      # "MAY THIS DOMAIN BE CLAIMED?" — eleven paths could cause a vhost to be
      # written and each carried its own subset of the guards. sites.rs even had
      # a shared helper whose comment said it existed "so the guard set create()
      # enforces cannot drift"; two of the eleven called it. docker_apps::deploy
      # checked nothing at all, git_deploys::update dropped both conflict queries
      # its own create runs, staging::create — the tenant-reachable one —
      # consulted only the sites table, and a Docker app's domain lives solely in
      # a container label, so no SQL guard could see it in the first place.
      #
      # "WHAT WAS HERE BEFORE I WROTE?" — three writers replaced
      # /etc/nginx/sites-enabled/{domain}.conf and, when the WHOLE-SERVER
      # `nginx -t` failed, deleted it, under a comment promising a restore. An
      # unrelated broken vhost anywhere on the box was enough, so an ordinary
      # settings toggle could remove a healthy site's configuration.
      #
      # §B is the arm that matters: a new domain-introducing surface that does
      # not call the shared guard fails here. §B2 forbids private conflict
      # queries, which is how create and update came to disagree.
      - name: Every path claims through one guard, and no write destroys what it replaced
        run: bash tests/domain-claim-pin-e2e.sh

  ownership-delete:
    name: A Delete Proves It Owns What It Deletes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. v2.52.0 pinned "may this domain be CLAIMED?".
      # This pins the question after it: "is the thing I am about to DESTROY
      # actually mine?" Nothing owned that question, so every removal named its
      # target by a key it had never checked, and the key lied two ways.
      #
      # IT NAMED AN IDENTITY NOBODY RE-VERIFIED. Removing a Docker app deleted
      # the vhost, cert directory, logs and data tree of whatever its
      # `dockpanel.app.domain` label said — by then possibly a site's. The git
      # preview sweep did the same from an unattended 5-minute loop.
      #
      # IT WAS NOT INJECTIVE. `domain.replace('.', "-")` maps a.b.com and
      # a-b.com onto one name, and `-` is legal in a domain label, so one
      # tenant's site deletion removed another's systemd unit and Fail2Ban jail.
      # v2.52.0 fixed exactly this for Traefik and then re-introduced it in the
      # legacy-name CLEANUP, where it fires on a FRESH install and never expires.
      #
      # §B is the arm that matters: a destructive path that does not ask fails
      # here. §C is an ABSENCE section, so §0 measures the comment stripper and
      # C0 asserts the file list is non-empty before the absence arms are
      # allowed to mean anything — an absence arm on an empty subject set is
      # green and worthless.
      #
      # ATTACKED: 24 deliberate evasions against the fixed tree, of which SEVEN
      # beat the first draft — including both classes that beat the s294 pin (a
      # guard called and its result discarded, and a delete reached through a
      # renamed variable). Every arm they beat is now keyed on the property.
      - name: Every destructive path proves ownership, and markers are anchored
        run: bash tests/ownership-delete-pin-e2e.sh

  container-identity:
    name: A Container Name Is Not A Key Anybody Owns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. `dockpanel-git-{X}` was the container of a git
      # deployment called X AND of a preview of config C on branch B whenever
      # `{C}-pr-{slug(B)}` spelled X — a name `is_valid_name` accepts and an
      # admin creates by ordinary means. `find_container` filtered
      # `list_containers` by name, returned the first exact match, and that was
      # the whole of the check.
      #
      # What the agent then did with it was blue-green: read the domain off the
      # container it had just FOUND, swap that domain's vhost to the pushed
      # build, force-remove the container behind it, report a successful
      # zero-downtime deploy. The v2.53.0 ownership guard authorised the vhost
      # write, correctly — the victim's container really was the one behind the
      # victim's vhost. `services::ownership` had five primitives and every one
      # of them read a file; the largest thing the agent destroys had none.
      #
      # §A is the arm that matters and the one most likely to rot silently: the
      # separation rests on the preview scope using a character the NAME
      # VALIDATOR rejects, so A2 reads the marker out of the source and checks
      # it against both trees' validators rather than hardcoding either.
      #
      # §B5 pins the trap inside the fix. The compatibility path reaches the old
      # shared space, where every container predating this release is
      # unlabelled — INCLUDING THE VICTIM'S — so answering "mine" on the absence
      # of a label would have carried the original unattended delete straight
      # through the remedy. It demands the caller's own recorded port instead.
      #
      # §C1 is a property arm, not an absence arm: moving the stand-in suffix
      # into the shared helper would satisfy an absence arm over the two twins
      # while changing nothing.
      #
      # ATTACKED: 18 deliberate evasions against the fixed tree, all caught,
      # THREE of which beat the first draft — the stand-in suffix moved into the
      # helper (the check moving with the code), one of two promotion renames
      # made best-effort while the arm required only one, and `scope: ""`, field
      # present but EMPTY, for the third release running. Two further arms
      # passed on v2.54.0's own defect until the suite was run against the tag:
      # both described the function rather than the promotion. A null mutation
      # is included as a control.
      - name: A container proves it is the one the caller asked for
        run: bash tests/container-identity-pin-e2e.sh

  unattended-host-scope:
    name: An Unattended Service Must Name The Host It Acts On
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. DockPanel's multi-server migration reached every
      # HTTP route and NOT ONE background service: all twelve were spawned with
      # `AppState.agent` (the doc-commented "Legacy single-agent accessor")
      # while `AppState.agents` — the registry that "dispatches to local or
      # remote agents by server_id" — went unused outside the request path.
      #
      # For the disk healer that is destruction rather than routing.
      # `auto_clean_disk` read ONE firing `disk` row with no `server_id`
      # predicate and sent the fixes to the local agent, so in a fleet ANY
      # member crossing its threshold made the panel host clean and prune
      # ITSELF while the full machine was never touched. Driven on a two-box
      # fleet against released v2.55.0: member at 93%, panel host at 18% with
      # its own disk never measured, and forty seconds after auto-healing was
      # switched on the panel host lost a tenant's container and its image — an
      # app the panel had itself put to sleep — while reporting "disk cleanup
      # succeeded".
      #
      # Three compounding defects are pinned alongside it. The hourly cooldown
      # counted `activity_logs` rows written with `Uuid::nil()`, which violates
      # `fk_activity_logs_user`, so every insert failed, the count was always 0
      # and the prune ran every 120 SECONDS — measured at 19:16:13, 19:18:13,
      # 19:20:13, 19:22:13. The recovery UPDATE skipped `resolve_alert`, so the
      # `alerts` row stayed firing for ever and retention, which purges only
      # `status='resolved'`, could never reach it. And policy retention unlinked
      # a path the writer never creates, discarded the ENOENT, and deleted the
      # row regardless.
      #
      # 26 arms, 20 red against v2.55.0. Two arms survived that run legitimately
      # (the harness self-check, and the arm asserting a log write is attempted
      # — its sibling is what catches the nil uuid). Running it red also exposed
      # TWO FALSE GREENS in this suite's own §C: absence arms over a subject
      # that does not exist in v2.55.0 are vacuously true, so they now SKIP when
      # the reclaim arm cannot be extracted (#143's shape, found only by running
      # the suite against the previous tag).
      - name: An unattended service names the host it acts on
        run: bash tests/unattended-host-scope-pin-e2e.sh

  compose-stack:
    name: A Stack Is A Network, A Namespace, And An Honest Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure source analysis. GitHub #50: a reporter took the Compose stack
      # package shipped for him in v2.52.0 and got "always crashing apps, ssl
      # doesnt work properly". He was right on both halves, and the cause was
      # not his box.
      #
      # DockPanel's Compose support does not run `docker compose` — it creates
      # each service through the Docker API so the panel's own sandboxing
      # applies. That means every convenience compose gives for free has to be
      # reproduced deliberately, and almost none of it was. Services were
      # created with NO user-defined network, so container-name DNS did not
      # exist and `postgresql://app:pw@database:5432` could not resolve. Every
      # multi-service package the panel ships — Domain Watchdog, WordPress,
      # Ghost, Nextcloud — died on boot for the same reason.
      #
      # It looked healthy because `deploy_service` reported "running" on the
      # strength of `create` + `start` returning Ok, and because the one e2e
      # test for stacks deployed a single nginx and asserted that a UUID came
      # back. A one-service stack cannot fail this way; deep-e2e.sh now deploys
      # two and asserts one resolves the other.
      #
      # §A is the arm that matters: reintroduce the missing network or the
      # missing alias and it fails. §F pins an ORDER, not a pair of statements —
      # the stack YAML has no history table, and the write used to land before
      # anything knew whether the new definition ran.
      #
      # ATTACKED: 17 deliberate evasions against the fixed tree, of which THREE
      # beat the first draft — an alias field present but EMPTY, a
      # `confirm_running` whose result was discarded (the class that beat the
      # s294 pin), and a teardown arm that matched `dockpanel.managed` inside
      # the log line NARRATING the check rather than the check itself. Every arm
      # they beat is now keyed on the property. A null mutation is included as a
      # control: a harness that cannot report a green is not reporting.
      - name: Stacks share a network, scope their names, and report real status
        run: bash tests/compose-stack-pin-e2e.sh

  # s317: sixteen of the thirty-three suites named in docs/testing.md had no job
  # here at all — auth-doors, sandbox-paths, site-backup-databases, the three
  # mail pins, suspend-restore and nine more. They were green on the machine of
  # whoever last ran them by hand and nothing else executed them, which is the
  # same shape as the pre-push hook that spent an unknown number of releases in
  # `.git/hooks/` where git does not look: a safety net nothing runs.
  #
  # This job runs EVERY suite, so a new one is covered on the day it is written
  # rather than on the day somebody remembers to add a job. The suites that have
  # their own job above keep it — a named job says which invariant broke, and
  # these cost seconds each — so the overlap is deliberate, not an oversight.
  #
  # The two that need a prepared box are excluded and run in their own jobs with
  # the setup they need: nginx-contract serves configs through a real nginx, and
  # update-rollback drives restore-snapshot.sh end to end.
  #
  # The count guard is the point of the `find` (an arm that enumerates its own
  # subjects must assert the enumeration first): a glob that matches nothing
  # would otherwise report a green having run no suite at all.
  regression-pins:
    name: Every Regression Pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Every source-only pin suite runs
        run: |
          shopt -s nullglob
          failed=0
          ran=0
          # Collect the NAMES of the suites that fail, and their exit codes.
          #
          # This job reported a bare `exit 1` for at least two tags (b429edf and
          # fef8177) while every suite in its own log printed `FAIL 0`, because
          # `bash "$s" || failed=1` throws away which `$s` it was. A suite can
          # exit non-zero without printing a single ✗ — a `set -u` on an unbound
          # variable, a missing tool on the runner, a stray non-zero at end of
          # file — and none of that is visible in a wall of green summaries.
          # A red that cannot name its cause is a red nobody can act on, which
          # is how this one survived two ships.
          declare -a broke=()
          for s in tests/*-pin-e2e.sh; do
            case "$(basename "$s")" in
              # NOT source-only — each needs something a runner does not have.
              # nginx-headers serves configs through a real nginx; update-rollback
              # drives restore-snapshot.sh end to end.
              #
              # tier2 is the one that had been failing every run since it was
              # added (b0ec6ce): it runs `docker exec dockpanel-postgres psql`,
              # INSERTs a row into `servers` and reads it back, so on a runner it
              # dies at `FATAL: Admin user row not found` and exits 1. It passes
              # on a developer box ONLY because that box has a live panel DB with
              # that admin row — which is also why a local sweep can never
              # reproduce this red. It is a LIVE suite living under the
              # source-only glob, not a broken pin.
              nginx-headers-pin-e2e.sh|update-rollback-pin-e2e.sh|tier2-pin-e2e.sh) continue ;;
            esac
            echo "── $s"
            if bash "$s"; then :; else
              rc=$?
              failed=1
              broke+=("$(basename "$s") (exit $rc)")
              echo "::warning::$(basename "$s") exited $rc"
            fi
            ran=$((ran + 1))
          done
          echo "ran $ran source-only pin suites"
          if [ "$ran" -lt 30 ]; then
            echo "::error::only $ran suites ran — the enumeration is wrong, so a green here proves nothing"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::${#broke[@]} suite(s) exited non-zero: ${broke[*]}"
          fi
          exit $failed
