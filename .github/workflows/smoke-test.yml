name: Install smoke-test

# ABI / loader smoke-test for the published release binaries (#70 regression guard).
#
# Why this exists: v2.10.2 fixed installs failing on Debian 12 with
# `GLIBC_2.38 not found` — the release binaries were dynamically linked against
# a too-new glibc from the ubuntu-latest build runner. The fix ships fully
# static musl binaries. This workflow proves, on every published release, that
# the actual downloadable assets are statically linked AND exec cleanly (no
# loader/GLIBC error) across the documented support-matrix distros — so a future
# change that reintroduces a glibc dependency is caught before users hit it.
#
# Scope: this is an ABI/loader smoke-test, NOT a full functional install. The
# heavier end-to-end `install.sh` test (Docker + Postgres + nginx provisioning)
# is the separate fresh-VPS gate. Covers amd64 + arm64.
#
# The matrix must span EVERY distro family named in the README support line —
# `tests/docs-claims-pin-e2e.sh` §5 fails the build if a family is claimed there
# and absent here. Until 2026-07-26 it listed only the apt families, so the RPM
# half of a six-family support claim had never been verified by anything: a
# green check measuring the honest half. Both floors are pinned deliberately
# (debian:11 / ubuntu:20.04 = glibc 2.31; fedora:39 is the README's stated
# floor) even though static musl has no libc floor — the point is that the
# claim and the evidence move together.

# NOTE ON TRIGGERS: `release: [published]` alone never fires this workflow.
# release.yml publishes with the default GITHUB_TOKEN, and GitHub deliberately
# does not start new workflow runs from events raised by that token (recursion
# guard). Between the workflow landing and 2026-07-19 it had therefore only ever
# run via workflow_dispatch — the #70 regression guard was inert for v2.10.2,
# v2.11.0 and v2.11.1. `workflow_call` is what actually wires it in: release.yml
# invokes it as a dependent job once the assets are published.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to test'
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (blank = latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # `inputs.tag` covers both workflow_call and workflow_dispatch.
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo '${{ github.repository }}' --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing release: $TAG"

  smoke:
    needs: resolve
    runs-on: ubuntu-latest
    # Force bash in the distro containers (default would be `sh`/dash on some
    # images, which rejects `set -o pipefail` and bash-isms used below).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        distro:
          # apt families — README: "Ubuntu 20+, Debian 11+"
          - debian:11
          - debian:12
          - debian:13
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          # rpm families — README: "CentOS 9+, Rocky 9+, AlmaLinux 9+, Fedora 39+"
          # amazonlinux is deliberately NOT claimed on any surface: get.docker.com
          # has no `amzn` branch, so the installer cannot provision Docker there,
          # and no image is available to us to verify a fix against. It stays in
          # the matrix as free ABI coverage — if support is ever built, the
          # evidence for the binaries half is already here.
          - rockylinux:9
          - almalinux:9
          - quay.io/centos/centos:stream9
          - fedora:39
          - fedora:43
          - amazonlinux:2023
    container:
      image: ${{ matrix.distro }}
    steps:
      # BOUNDED AND RETRIED ON PURPOSE (s305). This step reaches a distro's own
      # package mirror, which is the one thing in this matrix we do not control.
      # It hung on `ubuntu:22.04` on two consecutive release runs — 18 minutes on
      # the first, still going at 6 on the second — while the identical step
      # passed on ubuntu:20.04 and 24.04 in the SAME runs, and a re-run of the
      # very same job passed. So it is intermittent rather than broken, roughly a
      # coin flip on that one image.
      #
      # Unbounded, that costs a whole release run: nothing here had a timeout, so
      # the only limit was the 6-hour workflow default, and a stall looks exactly
      # like a slow job right up until someone goes and reads the step. Each
      # attempt is now capped and retried, so a mirror stall costs ~4 minutes and
      # a genuine failure still fails the job with a real message.
      #
      # `timeout` is coreutils and is present on every image in this matrix. The
      # body goes in a file rather than a shell function because these run inside
      # the distro container, whose /bin/sh is not always bash.
      - name: Install fetch deps
        run: |
          set -eu
          cat > /tmp/install-fetch-deps.sh <<'DEPS'
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates file >/dev/null
          elif command -v dnf >/dev/null 2>&1; then
            # --allowerasing is load-bearing on amazonlinux:2023: the image ships
            # curl-minimal, which CONFLICTS with the full curl package, and dnf
            # aborts the whole transaction rather than substituting. Verified by
            # running the step without the flag (transaction fails, exit non-zero).
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
                curl ca-certificates file >/dev/null
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y curl ca-certificates file >/dev/null
          elif command -v yum >/dev/null 2>&1; then
            yum install -y curl ca-certificates file >/dev/null
          else
            echo "FAIL: no supported package manager — this matrix entry cannot fetch the release assets."
            exit 1
          fi
          DEPS

          for attempt in 1 2 3; do
            echo "::group::package install attempt ${attempt}"
            # Capture the status with `|| rc=$?`, NOT by reading $? after an `if`:
            # a false `if` with no `else` is itself a SUCCESS, so `rc=$?` on the
            # line after `fi` reads 0 every time and the branch below would
            # report "exited 0" for a run that actually timed out. Caught by
            # testing the timeout path rather than only the happy one.
            rc=0
            timeout 240 sh /tmp/install-fetch-deps.sh || rc=$?
            if [ "$rc" = 0 ]; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # 124 is timeout(1)'s "the command was killed at the deadline".
            if [ "$rc" = 124 ]; then
              echo "::warning::package install timed out after 240s on attempt ${attempt} (distro mirror stalled)"
            else
              echo "::warning::package install exited ${rc} on attempt ${attempt}"
            fi
            sleep 15
          done

          echo "FAIL: could not install curl/ca-certificates/file after 3 attempts."
          exit 1

      - name: Download published binaries (amd64)
        run: |
          set -eu
          TAG='${{ needs.resolve.outputs.tag }}'
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          # Retried in a shell loop rather than with `curl --retry`: a connection
          # reset by the asset CDN is not one of the "transient errors" plain
          # --retry covers, and --retry-all-errors needs curl 7.71 while
          # ubuntu:20.04 in this same matrix ships 7.68. v2.106.0's release ran
          # red on exactly this — `curl: (35) OpenSSL SSL_connect: Connection
          # reset by peer` against release-assets.githubusercontent.com — on the
          # step directly BELOW the package install that was given retries in
          # bfbad47. The hardening stopped one step short.
          for b in agent api cli; do
            n=0
            until curl -fsSL --connect-timeout 20 --max-time 300 \
                       "${BASE}/dockpanel-${b}-linux-amd64" -o "dockpanel-${b}"; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "FAIL: could not download dockpanel-${b}-linux-amd64 after ${n} attempts."
                exit 1
              fi
              echo "::warning::download of dockpanel-${b}-linux-amd64 failed (attempt ${n}) - retrying"
              sleep $((n * 3))
            done
            chmod +x "dockpanel-${b}"
          done

      - name: Assert static linkage (primary #70 guard)
        run: |
          set -eux
          for b in agent api cli; do
            file "dockpanel-${b}"
            if ! file "dockpanel-${b}" | grep -c "statically linked" >/dev/null; then
              echo "FAIL: dockpanel-${b} is NOT statically linked on ${{ matrix.distro }} — would reintroduce the #70 glibc break."
              exit 1
            fi
          done

      - name: Exec probe (loader must accept the binaries on this distro)
        run: |
          # GitHub Actions invokes bash with `-eo pipefail` by default, so a
          # benign non-zero exit (the API/agent panic on missing env, captured
          # via command substitution) would otherwise abort the step. Neutralise
          # both and manage exit codes explicitly via $fail.
          set +e +o pipefail
          mkdir -p /var/run/dockpanel
          fail=0
          # A static binary that loads correctly reaches main(). It may then exit
          # non-zero for a benign runtime reason (the API/agent panic on missing
          # JWT_SECRET/DATABASE_URL env, the agent boots until timeout) — that is
          # NOT a #70 failure. We ONLY hard-fail on a real loader/ABI error, which
          # is the exact signature #70 produced (`... GLIBC_2.38 not found`).
          for b in cli api agent; do
            out="$(timeout 6 ./dockpanel-$b --version 2>&1)"; rc=$?
            echo "--- dockpanel-$b (rc=$rc) ---"
            printf '%s\n' "$out" | head -4
            if printf '%s' "$out" | grep -ciE "GLIBC_|not a dynamic executable|cannot execute binary|Exec format error" >/dev/null; then
              echo "FAIL: loader/ABI error for dockpanel-$b on ${{ matrix.distro }} — the #70 break."
              fail=1
            fi
          done
          # Positive proof that at least one binary reaches main() on this distro:
          # the CLI has a real --version path that prints and exits 0.
          if ! timeout 6 ./dockpanel-cli --version | grep -ci dockpanel >/dev/null; then
            echo "FAIL: dockpanel-cli --version did not print a version on ${{ matrix.distro }}"
            fail=1
          fi
          exit $fail

  # arm64 ABI/loader guard (#70 extended to aarch64). The published
  # dockpanel-*-linux-arm64 assets come from the same musl target but were never
  # exec-proven. Runs on the host (NOT in a container) so docker/setup-qemu-action
  # can register arm64 binfmt, then execs the arm64 binaries under QEMU emulation.
  # One arm64 env is sufficient: static musl has zero distro-specific libc deps.
  smoke-arm64:
    needs: resolve
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up QEMU (arm64 emulation via binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download published binaries (arm64)
        run: |
          set -eu
          TAG='${{ needs.resolve.outputs.tag }}'
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          # Retried in a shell loop rather than with `curl --retry`: a connection
          # reset by the asset CDN is not one of the "transient errors" plain
          # --retry covers, and --retry-all-errors needs curl 7.71 while
          # ubuntu:20.04 in this same matrix ships 7.68. v2.106.0's release ran
          # red on exactly this — `curl: (35) OpenSSL SSL_connect: Connection
          # reset by peer` against release-assets.githubusercontent.com — on the
          # step directly BELOW the package install that was given retries in
          # bfbad47. The hardening stopped one step short.
          for b in agent api cli; do
            n=0
            until curl -fsSL --connect-timeout 20 --max-time 300 \
                       "${BASE}/dockpanel-${b}-linux-arm64" -o "dockpanel-${b}"; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "FAIL: could not download dockpanel-${b}-linux-arm64 after ${n} attempts."
                exit 1
              fi
              echo "::warning::download of dockpanel-${b}-linux-arm64 failed (attempt ${n}) - retrying"
              sleep $((n * 3))
            done
            chmod +x "dockpanel-${b}"
          done

      - name: Assert static linkage (primary #70 guard, arm64)
        run: |
          set -eux
          for b in agent api cli; do
            file "dockpanel-${b}"
            if ! file "dockpanel-${b}" | grep -c "statically linked" >/dev/null; then
              echo "FAIL: dockpanel-${b} (arm64) is NOT statically linked — would reintroduce the #70 glibc break."
              exit 1
            fi
          done

      - name: Exec probe under arm64 emulation (loader must accept the binaries)
        run: |
          # Only the tiny --version path is emulated; the arm64 binaries run in a
          # real aarch64 userland (debian:12 arm64) via QEMU binfmt. Static musl =
          # no distro-specific libs, so one arm64 env is sufficient. Generous
          # timeout because user-mode emulation adds overhead. Same neutralised
          # exit handling as the amd64 job: a benign non-zero (api/agent panic on
          # missing env) is NOT a #70 failure — only a real loader/ABI error is.
          set +e +o pipefail
          fail=0
          run_arm64() { docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w debian:12 "$@"; }
          for b in cli api agent; do
            out="$(run_arm64 timeout 30 ./dockpanel-$b --version 2>&1)"; rc=$?
            echo "--- dockpanel-$b (arm64, rc=$rc) ---"
            printf '%s\n' "$out" | head -4
            if printf '%s' "$out" | grep -ciE "GLIBC_|not a dynamic executable|cannot execute binary|Exec format error" >/dev/null; then
              echo "FAIL: loader/ABI error for dockpanel-$b (arm64) — the #70 break."
              fail=1
            fi
          done
          # Positive proof the arm64 CLI reaches main(): --version prints and exits 0.
          if ! run_arm64 timeout 30 ./dockpanel-cli --version | grep -ci dockpanel >/dev/null; then
            echo "FAIL: dockpanel-cli --version (arm64) did not print a version"
            fail=1
          fi
          exit $fail
